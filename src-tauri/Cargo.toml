[package]
name = "manuscript-tracker"
version = "1.0.0"
description = "Manuscript Tracker desktop app"
authors = ["Naim Bin Hasan"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.85"

[lib]
name = "manuscript_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "serde_json", "column_decltype", "cache"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2.0.21"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "time", "sync", "macros"] }
getrandom = "0.3.4"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-window-state = "2.4.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "gzip", "brotli"] }
window-vibrancy = "0.8.1"
scraper = "0.29.0"
roxmltree = "0.21.2"
sha2 = "0.11.0"
regex = "1.13.2"
url = "2.5.9"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
