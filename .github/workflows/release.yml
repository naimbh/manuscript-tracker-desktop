name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The version without the leading "v", for the download links in the release notes.
      - run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI=false lets the macOS bundler lay out the .dmg window (background and icon positions) with Finder.
          CI: ${{ runner.os == 'macOS' && 'false' || 'true' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Manuscript Tracker ${{ github.ref_name }}
          releaseBody: |
            The offline-first manuscript tracker. Your papers stay on your computer.

            Downloads:
            - macOS (Apple silicon and Intel): [Manuscript.Tracker_${{ env.APP_VERSION }}_universal.dmg](https://github.com/naimbh/manuscript-tracker-desktop/releases/download/${{ github.ref_name }}/Manuscript.Tracker_${{ env.APP_VERSION }}_universal.dmg)
            - Windows: [Manuscript.Tracker_${{ env.APP_VERSION }}_x64-setup.exe](https://github.com/naimbh/manuscript-tracker-desktop/releases/download/${{ github.ref_name }}/Manuscript.Tracker_${{ env.APP_VERSION }}_x64-setup.exe) (or the [.msi](https://github.com/naimbh/manuscript-tracker-desktop/releases/download/${{ github.ref_name }}/Manuscript.Tracker_${{ env.APP_VERSION }}_x64_en-US.msi))
            - Linux: [.AppImage](https://github.com/naimbh/manuscript-tracker-desktop/releases/download/${{ github.ref_name }}/Manuscript.Tracker_${{ env.APP_VERSION }}_amd64.AppImage), [.deb](https://github.com/naimbh/manuscript-tracker-desktop/releases/download/${{ github.ref_name }}/Manuscript.Tracker_${{ env.APP_VERSION }}_amd64.deb) or [.rpm](https://github.com/naimbh/manuscript-tracker-desktop/releases/download/${{ github.ref_name }}/Manuscript.Tracker-${{ env.APP_VERSION }}-1.x86_64.rpm)

            The installers are not signed yet, so your system will ask you to confirm the first launch. The [README](https://github.com/naimbh/manuscript-tracker-desktop#download) explains how.
            Installed copies update themselves: the app checks for new versions and installs them when you restart.
          releaseDraft: true
          includeUpdaterJson: true
          prerelease: false
          args: ${{ matrix.args }}
