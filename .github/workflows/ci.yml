name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the interface
        run: npm run build:web

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

      # Signed update bundles are made by the release workflow only.
      # CI=false lets the macOS bundler lay out the .dmg window (background and icon positions) with Finder.
      - name: Build installers
        env:
          CI: ${{ runner.os == 'macOS' && 'false' || 'true' }}
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  e2e:
    name: End-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev pkg-config webkit2gtk-driver xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: e2e

      - run: npm ci

      - name: Build the app (debug)
        run: npx tauri build --debug --no-bundle

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install msedgedriver
        if: runner.os == 'Windows'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          echo "NATIVE_DRIVER=$PWD\msedgedriver.exe" >> $env:GITHUB_ENV

      - name: Check that the app starts
        if: runner.os == 'Windows'
        run: |
          $env:MT_DATA_DIR = "$env:RUNNER_TEMP\mt-start"
          $env:MT_E2E = "1"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $env:WEBVIEW2_USER_DATA_FOLDER = "$env:RUNNER_TEMP\wv2"
          $p = Start-Process -FilePath src-tauri\target\debug\manuscript-tracker.exe -PassThru -RedirectStandardError "$env:RUNNER_TEMP\err.txt" -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt"
          Start-Sleep -Seconds 15
          "running: $(-not $p.HasExited)"
          Get-Content "$env:RUNNER_TEMP\err.txt", "$env:RUNNER_TEMP\out.txt" -ErrorAction SilentlyContinue
          "--- DevToolsActivePort files:"
          Get-ChildItem -Recurse -Filter DevToolsActivePort -Path "$env:RUNNER_TEMP", "$env:LOCALAPPDATA" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          "--- debugging port:"
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9222/json/version -TimeoutSec 5).Content } catch { "no answer: $_" }
          "--- web view folders:"
          Get-ChildItem -Directory "$env:RUNNER_TEMP\wv2", "$env:LOCALAPPDATA\com.naimbh.manuscripttracker" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } else { "exit code: $($p.ExitCode)"; exit 1 }

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci

      - name: Run the tour (Linux)
        if: runner.os == 'Linux'
        working-directory: e2e
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x960x24" node run.mjs

      - name: Run the tour (Windows)
        if: runner.os == 'Windows'
        working-directory: e2e
        run: node run.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: e2e/screenshots/
