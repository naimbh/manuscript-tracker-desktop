<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1748dc"/><stop offset=".55" stop-color="#0f25a3"/><stop offset="1" stop-color="#08106b"/>
  </linearGradient>
  <radialGradient id="hi" cx=".25" cy=".12" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eceffd"/></linearGradient>
  <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5ff"/><stop offset="1" stop-color="#c9d0f5"/></linearGradient>
  <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3550d6"/><stop offset=".45" stop-color="#1c2c9e"/><stop offset="1" stop-color="#101a6a"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd970"/><stop offset=".5" stop-color="#f6b81c"/><stop offset="1" stop-color="#d9930a"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020a3d" flood-opacity=".35"/></filter>
  <filter id="softsm" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020a3d" flood-opacity=".3"/></filter>
  <clipPath id="tileclip"><rect width="1000" height="1000" rx="225"/></clipPath>
</defs>
<g clip-path="url(#tileclip)">
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#hi)"/>
</g>
<g filter="url(#soft)">
  <rect x="150" y="300" width="400" height="560" rx="44" fill="#8b9cf0" transform="rotate(-13 350 580)"/>
  <rect x="200" y="255" width="420" height="575" rx="44" fill="#b8c3f8" transform="rotate(-7 410 540)"/>
  <path d="M330 170 H640 L800 330 V790 a48 48 0 0 1 -48 48 H330 a48 48 0 0 1 -48 -48 V218 a48 48 0 0 1 48 -48 Z" fill="url(#page)"/>
</g>
<path d="M640 170 V288 a42 42 0 0 0 42 42 H800 Z" fill="url(#fold)" filter="url(#softsm)"/>
<!-- graduation cap -->
<g fill="#1b2b8c">
  <path d="M352 318 L492 262 L632 318 L492 374 Z"/>
  <path d="M408 344 V402 C450 432 534 432 576 402 V344 L492 378 Z" fill="#16237a"/>
  <path d="M612 326 V392" stroke="#1b2b8c" stroke-width="11" stroke-linecap="round" fill="none"/>
  <rect x="601" y="388" width="22" height="34" rx="9"/>
</g>
<!-- text lines -->
<g fill="#9ba7ea">
  <rect x="352" y="468" width="290" height="28" rx="14"/>
  <rect x="352" y="530" width="290" height="28" rx="14"/>
  <rect x="352" y="592" width="262" height="28" rx="14"/>
  <rect x="352" y="654" width="236" height="28" rx="14"/>
</g>
<!-- status stepper -->
<path d="M716 430 V528" stroke="#22b14c" stroke-width="12"/>
<path d="M716 528 V712" stroke="#8f9cdd" stroke-width="12"/>
<g>
  <circle cx="716" cy="430" r="40" fill="#22b14c"/><path d="m697 431 13 13 25-26" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="716" cy="528" r="40" fill="#22b14c"/><path d="m697 529 13 13 25-26" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="716" cy="622" r="33" fill="#fff" stroke="#f59e0b" stroke-width="13"/>
  <circle cx="716" cy="712" r="33" fill="#fff" stroke="#8f9cdd" stroke-width="13"/>
</g>
<!-- pen -->
<g transform="translate(300 660) rotate(-22)" filter="url(#softsm)">
  <rect x="-38" y="-280" width="76" height="430" rx="38" fill="url(#pen)"/>
  <rect x="-38" y="-170" width="76" height="24" fill="url(#gold)"/>
  <rect x="-38" y="96" width="76" height="24" fill="url(#gold)"/>
  <rect x="-58" y="-250" width="24" height="200" rx="12" fill="url(#gold)"/>
  <path d="M-38 150 H38 L8 262 Q0 282 -8 262 Z" fill="url(#gold)"/>
  <path d="M-4 200 L0 270 L4 200 Z" fill="#7a4d00" opacity=".55"/>
  <rect x="-26" y="-262" width="14" height="380" rx="7" fill="#fff" opacity=".12"/>
</g></svg>
