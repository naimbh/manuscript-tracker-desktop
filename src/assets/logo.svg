<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2557ea"/><stop offset=".5" stop-color="#1230b0"/><stop offset="1" stop-color="#090f62"/></linearGradient>
  <radialGradient id="hi" cx=".22" cy=".1" r=".8"><stop offset="0" stop-color="#9fc3ff" stop-opacity=".35"/><stop offset="1" stop-color="#9fc3ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="62.5" height="62.5" patternUnits="userSpaceOnUse"><path d="M62.5 0H0V62.5" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="2"/></pattern>
  <radialGradient id="gridfade" cx=".5" cy=".0" r=".9"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gm"><rect width="1000" height="1000" fill="url(#gridfade)"/></mask>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e9edfd"/></linearGradient>
  <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f6ff"/><stop offset="1" stop-color="#c5cdf6"/></linearGradient>
  <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a5b4fc" stop-opacity=".25"/><stop offset="1" stop-color="#6ee7b7"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020838" flood-opacity=".45"/></filter>
  <filter id="shs" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020838" flood-opacity=".35"/></filter>
  <clipPath id="tc"><rect width="1000" height="1000" rx="225"/></clipPath>
</defs>
<g clip-path="url(#tc)">
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#grid)" mask="url(#gm)"/>
  <rect width="1000" height="1000" fill="url(#hi)"/>
</g>
<!-- earlier version behind -->
<g filter="url(#sh)">
  <rect x="236" y="214" width="430" height="560" rx="46" fill="#7f93ee" transform="rotate(-9 451 494)"/>
  <path d="M312 176 H608 L728 296 V780 a50 50 0 0 1 -50 50 H312 a50 50 0 0 1 -50 -50 V226 a50 50 0 0 1 50 -50 Z" fill="url(#page)"/>
</g>
<path d="M608 176 V262 a40 40 0 0 0 40 40 H728 Z" fill="url(#fold)" filter="url(#shs)"/>
